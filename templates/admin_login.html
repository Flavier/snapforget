{% extends "base.html" %}
{% block extra_head %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block title %}{{ t('admin.login_title') }} · {{ t('brand') }}{% endblock %}
{% block content %}
<section class="narrow panel">
  <h1>{{ t('admin.login_title') }}</h1>
  {% if error %}
  <p class="error" role="alert">{{ t(error) }}</p>
  {% endif %}
  <form method="post" action="/admin/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input class="hp" type="text" name="website" value="" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label>
      {{ t('admin.user') }}
      <input type="text" name="username" autocomplete="username" maxlength="64" placeholder="admin" required>
    </label>
    <label>
      {{ t('auth.password') }}
      <input type="password" name="password" autocomplete="current-password" maxlength="128" required>
    </label>
    <button class="btn" type="submit">{{ t('admin.submit') }}</button>
  </form>
</section>
{% endblock %}
