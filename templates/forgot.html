{% extends "base.html" %}
{% block title %}{{ t('auth.forgot_title') }} · {{ t('brand') }}{% endblock %}
{% block content %}
<section class="narrow panel">
  <h1>{{ t('auth.forgot_title') }}</h1>
  <p class="lede">{{ t('auth.forgot_lead') }}</p>
  {% if error %}
  <p class="error" role="alert">{{ t(error) }}</p>
  {% endif %}
  <form method="post" action="{{ u('/forgot') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      {{ t('auth.email') }}
      <input type="email" name="email" value="{{ email }}" autocomplete="email" required>
    </label>
    <button class="btn" type="submit">{{ t('auth.forgot_submit') }}</button>
  </form>
  <p class="muted"><a href="{{ u('/login') }}">{{ t('auth.to_login') }}</a></p>
</section>
{% endblock %}
